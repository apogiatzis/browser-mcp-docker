; Base supervisor config. entrypoint.sh copies this to /tmp (so it works on a
; read-only root filesystem) and appends the optional CDP proxy program.
;
; Logs are wired to the container's stdout/stderr so `docker logs` just works.

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info
user=app

[program:chromium]
priority=10
command=%(ENV_CHROME_BIN)s
    --headless=new
    --remote-debugging-port=%(ENV_CDP_PORT)s
    --remote-debugging-address=127.0.0.1
    --no-sandbox
    --disable-dev-shm-usage
    --disable-gpu
    --no-first-run
    --no-default-browser-check
    --disable-background-networking
    --disable-background-timer-throttling
    --disable-backgrounding-occluded-windows
    --disable-renderer-backgrounding
    --disable-features=Translate,BackForwardCache,AcceptCHFrame,MediaRouter,OptimizationHints
    --disable-extensions
    --disable-sync
    --disable-default-apps
    --metrics-recording-only
    --mute-audio
    --hide-scrollbars
    --window-size=%(ENV_WINDOW_SIZE)s
    --user-data-dir=/tmp/chrome-user-data
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:mcp]
priority=20
; Connects to the already-running Chromium via CDP and serves MCP over HTTP/SSE.
; --allowed-hosts '*' disables the Host-header allowlist so agents can reach the
; server through a service name, LB, or published port (rely on network controls,
; not this check, for access restriction).
command=playwright-mcp
    --host %(ENV_MCP_HOST)s
    --port %(ENV_MCP_PORT)s
    --headless
    --allowed-hosts %(ENV_MCP_ALLOWED_HOSTS)s
    --output-dir %(ENV_MCP_OUTPUT_DIR)s
    --cdp-endpoint http://127.0.0.1:%(ENV_CDP_PORT)s
autorestart=true
; Give Chromium time to come up before MCP retries the CDP connection.
startsecs=5
startretries=30
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
